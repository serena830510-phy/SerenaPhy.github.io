<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>詳解影片庫</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  :root{
    --paper:#FFF6E4;
    --paper-line: rgba(122,74,20,0.08);
    --ink:#33240F;
    --ink-soft:#7A5E3A;
    --surface:#FFFDF8;
    --border:#EAD3A0;
    --amber:#F5A623;
    --amber-soft:#FCE7BC;
    --orange:#F0791E;
    --tag-1:#F0791E;
    --tag-2:#D9622B;
    --tag-3:#C98A1C;
    --tag-4:#E0521F;
    --tag-5:#B96A15;
    --shadow-hard: 2px 2px 0 rgba(122,74,20,0.14);
    --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:var(--font-main);
    min-height:100vh;
  }
  h1,h2,h3,.headline{
    font-family:var(--font-main);
    font-weight:700;
    margin:0;
  }
  /* ---------- Gate screen ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-card{
    background:var(--surface);
    border:1px solid var(--border);
    box-shadow:var(--shadow-hard);
    padding:40px 36px;
    max-width:360px;
    width:100%;
    position:relative;
  }
  .gate-card::before{
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 22px 22px 0;
    border-color:transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 0 var(--border));
  }
  .gate-card h1{font-size:22px; margin-bottom:6px; color:var(--orange);}
  .gate-card p{color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 0 22px;}
  .gate-card input[type=password]{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    border:1px solid var(--border);
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    margin-bottom:12px;
  }
  .gate-card input[type=password]:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .gate-card button{
    width:100%;
    padding:11px 12px;
    background:var(--orange);
    color:#fff;
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .gate-card button:hover{background:var(--tag-2);}
  #gate-error{color:var(--tag-2); font-size:13px; margin-top:10px; min-height:16px;}

  /* ---------- Main app ---------- */
  #app{display:none;}
  header.top{
    padding:36px 28px 20px;
    max-width:1080px;
    margin:0 auto;
  }
  header.top .eyebrow{
    font-size:13px;
    color:var(--orange);
    font-weight:600;
    margin-bottom:4px;
  }
  header.top h1{font-size:30px; line-height:1.3; color:var(--ink);}
  .search-row{
    max-width:1080px;
    margin:0 auto;
    padding:0 28px 8px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  #search{
    flex:1 1 240px;
    padding:11px 14px;
    font-size:15px;
    border:1px solid var(--border);
    background:var(--surface);
    font-family:inherit;
    color:var(--ink);
  }
  #search:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .chips{
    max-width:1080px;
    margin:0 auto;
    padding:14px 28px 0;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    padding:6px 14px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    user-select:none;
  }
  .chip.active{
    background:var(--orange);
    color:#fff;
    border-color:var(--orange);
  }

  section.recent{max-width:1080px; margin:32px auto 0; padding:0 28px;}
  section.recent h2{font-size:15px; color:var(--ink-soft); font-weight:600; margin-bottom:12px;}
  .recent-scroll{display:flex; gap:14px; overflow-x:auto; padding-bottom:8px;}
  .recent-scroll .card{min-width:200px;}

  main{max-width:1080px; margin:0 auto; padding:8px 28px 60px;}
  .chapter-block{margin-top:40px;}
  .chapter-title{
    display:flex; align-items:baseline; gap:10px;
    border-bottom:2px solid var(--amber-soft);
    padding-bottom:8px;
    margin-bottom:16px;
  }
  .chapter-title h3{font-size:19px; color:var(--ink);}
  .chapter-title .count{font-size:13px; color:var(--ink-soft);}
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    cursor:pointer;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 14px 14px 0;
    border-color:transparent var(--paper) transparent transparent;
    filter: drop-shadow(-1px 1px 0 var(--border));
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-hard);}
  .thumb{
    width:100%;
    aspect-ratio:16/9;
    background:linear-gradient(135deg, var(--amber-soft), var(--paper));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:26px;
    color:var(--orange);
    overflow:hidden;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .pl-label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .card-body{padding:12px 14px 14px;}
  .card-body .title{font-size:14px; font-weight:600; line-height:1.45; margin-bottom:8px; color:var(--ink);}
  .tag-row{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{
    font-size:11px;
    font-weight:600;
    padding:2px 8px;
    color:#fff;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .headline{font-size:20px; margin-bottom:8px; color:var(--ink);}

  /* ---------- Modal ---------- */
  #modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(51,36,15,0.75);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  #modal-box{
    background:var(--surface);
    max-width:800px;
    width:100%;
    border:1px solid var(--border);
  }
  #modal-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    gap:12px;
  }
  #modal-title{font-size:16px; font-weight:600; color:var(--ink);}
  #modal-close{
    background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);
    line-height:1; padding:2px 6px;
  }
  #modal-close:hover{color:var(--orange);}
  .video-frame{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  .video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  @media (max-width:520px){
    header.top{padding:26px 18px 14px;}
    header.top h1{font-size:24px;}
    .search-row, .chips, section.recent, main{padding-left:18px; padding-right:18px;}
  }

  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
  }
</style>
</head>
<body>

<!-- ============================================================ -->
<!-- 密碼登入畫面：請將下方 SITE_PASSWORD 改成你自己的通關密碼      -->
<!-- ============================================================ -->
<div id="gate">
  <div class="gate-card">
    <h1>詳解影片庫</h1>
    <p>本頁僅供本班學生使用，請輸入老師提供的通關密碼。</p>
    <input type="password" id="pw-input" placeholder="請輸入密碼" autocomplete="off">
    <button onclick="tryUnlock()">進入</button>
    <div id="gate-error"></div>
  </div>
</div>

<!-- ============================================================ -->
<!-- 主頁面 -->
<!-- ============================================================ -->
<div id="app">
  <header class="top">
    <div class="eyebrow">物理科・習題詳解</div>
    <h1>詳解影片庫</h1>
  </header>

  <div class="search-row">
    <input type="text" id="search" placeholder="搜尋題號、考卷名稱或關鍵字…" oninput="renderAll()">
  </div>
  <div class="chips" id="chapter-chips"></div>

  <section class="recent">
    <h2>最新上傳</h2>
    <div class="recent-scroll" id="recent-row"></div>
  </section>

  <main id="chapter-list"></main>
</div>

<!-- 影片播放彈窗 -->
<div id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div id="modal-box">
    <div id="modal-header">
      <div id="modal-title"></div>
      <button id="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="video-frame">
      <iframe id="modal-iframe" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定區：老師只需要修改這裡，不需要動下面的程式碼
   ============================================================ */

// 1) 通關密碼 —— 上架前請務必改成自己的密碼
const SITE_PASSWORD = "SerenaPhy";

// 2) 單元清單與顯示順序 —— 依你自己的授課章節調整名稱與順序即可
const CHAPTER_ORDER = ["運動學", "牛頓運動定律", "功與能量", "波動", "靜電與電路"];

// 3) 每支影片一筆資料。新增影片時，直接在陣列最後加一筆一模一樣格式的物件即可。
//    單一影片：填 youtubeId（YouTube 網址 watch?v= 後面那串英數字），playlistId 留空 ""
//    整個播放清單：填 playlistId（YouTube 網址 list= 後面那串英數字），youtubeId 留空 ""，
//                  並填 playlistCount（清單內影片數量，僅用於顯示，例如 8）
//    - chapter：對應上面 CHAPTER_ORDER 其中一個名稱
//    - examName：考卷/講義名稱（沒有可留空字串 ""）
//    - exerciseNumber：課本或講義題號（沒有可留空字串 ""）
//    - dateAdded：上傳日期 "YYYY-MM-DD"，用來排「最新上傳」
const VIDEOS = [
  { title:"等加速度運動 第3題", chapter:"運動學", examName:"第一次段考", exerciseNumber:"習題1-3", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-20" },
  { title:"相對運動應用題", chapter:"運動學", examName:"課本習題", exerciseNumber:"習題1-9", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-05" },
  { title:"自由落體綜合題", chapter:"運動學", examName:"", exerciseNumber:"習題1-12", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-07-22" },

  { title:"牛頓第二定律：斜面問題", chapter:"牛頓運動定律", examName:"第一次段考", exerciseNumber:"習題2-4", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-22" },
  { title:"摩擦力綜合應用", chapter:"牛頓運動定律", examName:"課後講義", exerciseNumber:"習題2-7", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-10" },

  { title:"功能定理基本題", chapter:"功與能量", examName:"課本習題", exerciseNumber:"習題3-2", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-18" },
  { title:"彈簧位能綜合題", chapter:"功與能量", examName:"第二次段考", exerciseNumber:"習題3-8", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-01" },

  { title:"駐波與共振", chapter:"波動", examName:"課後講義", exerciseNumber:"習題4-1", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-15" },

  { title:"克希荷夫定律入門", chapter:"靜電與電路", examName:"第二次段考", exerciseNumber:"習題5-6", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-25" },
  { title:"並聯電路電流分配", chapter:"靜電與電路", examName:"課本習題", exerciseNumber:"習題5-9", youtubeId:"dQw4w9WgXcQ", playlistId:"", playlistCount:0, dateAdded:"2026-08-12" },

  { title:"選物III 習作第1回（整份詳解播放清單）", chapter:"靜電與電路", examName:"選物III 習作", exerciseNumber:"第1回", youtubeId:"", playlistId:"PL7S9eRBsqmNGaBaUdeDcjB1iyi1QfEQFR", playlistCount:8, dateAdded:"2026-09-01" },

  // 這是老師實測貼上的第一支真實影片，測試成功後可以刪掉上面那些示範用的假資料
  { title:"測試影片", chapter:"運動學", examName:"", exerciseNumber:"", youtubeId:"N8us6CKQH4g", playlistId:"", playlistCount:0, dateAdded:"2026-09-01" }
];

/* ============================================================
   以下是網頁運作的程式碼，一般不需要修改
   ============================================================ */

const TAG_COLORS = ["var(--tag-1)","var(--tag-2)","var(--tag-3)","var(--tag-4)","var(--tag-5)"];
function chapterColor(chapter){
  const idx = CHAPTER_ORDER.indexOf(chapter);
  return TAG_COLORS[(idx>=0?idx:0) % TAG_COLORS.length];
}

let activeChapter = "全部";

function tryUnlock(){
  const val = document.getElementById('pw-input').value.trim();
  if(val === SITE_PASSWORD.trim()){
    localStorage.setItem('vidlib_unlocked','1');
    showApp();
  } else {
    document.getElementById('gate-error').textContent = "密碼不正確，請再試一次。";
  }
}
document.getElementById('pw-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });

function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  buildChips();
  renderAll();
}

function buildChips(){
  const wrap = document.getElementById('chapter-chips');
  const chapters = ["全部", ...CHAPTER_ORDER];
  wrap.innerHTML = chapters.map(c =>
    `<div class="chip ${c===activeChapter?'active':''}" data-chapter="${c}">${c}</div>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeChapter = chip.dataset.chapter;
      buildChips();
      renderAll();
    });
  });
}

function matchesSearch(v, q){
  if(!q) return true;
  q = q.toLowerCase();
  return [v.title, v.chapter, v.examName, v.exerciseNumber].join(' ').toLowerCase().includes(q);
}

function isPlaylist(v){ return !!v.playlistId; }

function cardHTML(v){
  const color = chapterColor(v.chapter);
  const tags = [v.chapter, v.exerciseNumber, v.examName].filter(Boolean);
  const thumb = isPlaylist(v)
    ? `<div class="thumb"><div>🎞️</div><div class="pl-label">播放清單・共 ${v.playlistCount} 部</div></div>`
    : `<div class="thumb"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg"
             onerror="this.style.display='none'; this.parentElement.innerHTML='🎬'"
             alt=""></div>`;
  const clickArg = isPlaylist(v)
    ? `null, ${JSON.stringify(v.playlistId)}, ${JSON.stringify(v.title)}`
    : `${JSON.stringify(v.youtubeId)}, null, ${JSON.stringify(v.title)}`;
  return `
    <div class="card" onclick='openModal(${clickArg})'>
      ${thumb}
      <div class="card-body">
        <div class="title">${v.title}</div>
        <div class="tag-row">
          ${tags.map((t,i)=>`<span class="tag" style="background:${i===0?color:'var(--ink-soft)'}">${t}</span>`).join('')}
        </div>
      </div>
    </div>`;
}

function renderAll(){
  const q = document.getElementById('search').value.trim();
  const filtered = VIDEOS.filter(v => matchesSearch(v,q) && (activeChapter==="全部" || v.chapter===activeChapter));

  const recent = VIDEOS.filter(v=>matchesSearch(v,q))
    .slice().sort((a,b)=> new Date(b.dateAdded) - new Date(a.dateAdded)).slice(0,8);
  document.getElementById('recent-row').innerHTML = recent.map(cardHTML).join('') || `<div style="color:var(--ink-soft); font-size:14px;">沒有符合的影片</div>`;

  const list = document.getElementById('chapter-list');
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="headline">找不到符合的影片</div><div>換個關鍵字，或選擇不同單元試試看。</div></div>`;
    return;
  }

  const order = activeChapter==="全部" ? CHAPTER_ORDER : [activeChapter];
  list.innerHTML = order.map(ch=>{
    const items = filtered.filter(v=>v.chapter===ch);
    if(items.length===0) return '';
    return `
      <div class="chapter-block">
        <div class="chapter-title">
          <h3>${ch}</h3>
          <span class="count">${items.length} 部影片</span>
        </div>
        <div class="card-grid">${items.map(cardHTML).join('')}</div>
      </div>`;
  }).join('');
}

function openModal(youtubeId, playlistId, title){
  document.getElementById('modal-title').textContent = title;
  const src = playlistId
    ? `https://www.youtube-nocookie.com/embed/videoseries?list=${playlistId}&autoplay=1`
    : `https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1`;
  document.getElementById('modal-iframe').src = src;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modal-overlay').style.display = 'none';
  document.getElementById('modal-iframe').src = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// 若這台裝置先前已輸入過正確密碼，直接進入
if(localStorage.getItem('vidlib_unlocked')==='1'){ showApp(); }
</script>
</body>
</html>
